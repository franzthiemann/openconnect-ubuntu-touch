auth = "plain[passwd=/etc/ocserv/ocpasswd]"

tcp-port = 4443
udp-port = 4443
run-as-user = nobody
run-as-group = nogroup
socket-file = /run/ocserv-socket

server-cert = /etc/ocserv/server-cert.pem
server-key  = /etc/ocserv/server-key.pem

max-clients = 8
max-same-clients = 4
keepalive = 32
dpd = 90
mobile-dpd = 1800
try-mtu-discovery = true

device = vpns
ipv4-network = 10.99.0.0
ipv4-netmask = 255.255.255.0

# Exercised by the bridge: these become INTERNAL_IP4_DNS / CISCO_DEF_DOMAIN and
# the CISCO_SPLIT_INC_%d_{ADDR,MASK} family in the --script-tun environment.
dns = 10.99.0.53
default-domain = rig.test
route = 10.200.0.0/255.255.0.0
route = 172.31.5.0/255.255.255.0

cisco-client-compat = true
